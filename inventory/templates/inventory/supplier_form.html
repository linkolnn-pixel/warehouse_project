{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Новый поставщик</h2>
    <form method="post">
        {% csrf_token %}
        <!-- Если форма вернулась с ошибками -->
        {% if form.errors %}
            <div class="alert alert-danger">Пожалуйста, исправьте ошибки ниже.</div>
        {% endif %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="javascript:history.back()" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
