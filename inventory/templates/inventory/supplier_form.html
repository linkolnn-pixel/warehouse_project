{% extends "inventory/base.html" %}
{% block title %}Новый поставщик{% endblock %}
{% block content %}
<div class="form-shell panel p-4">
    <h1 class="page-title mb-4">Новый поставщик</h1>
    <form method="post" class="field-stack">
        {% csrf_token %}
        <!-- Если форма вернулась с ошибками -->
        {% if form.errors %}
            <div class="alert alert-danger">Пожалуйста, исправьте ошибки ниже.</div>
        {% endif %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ cancel_url }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
