{% extends 'inventory/base.html' %}

{% block title %}Новая категория - Склад{% endblock %}

{% block content %}
<div class="form-shell">
    <div class="row justify-content-center mx-0">
        <div class="col-md-6">
            <div class="card p-4">
                <h2 class="text-center mb-4"><i class="fas fa-tags me-2"></i>Новая категория</h2>
                <hr class="my-4">

                <!-- Вывод сообщений об ошибках или успехе -->


                <form method="post">
                    {% csrf_token %}

                    <!-- Поле Название (name) -->
                    <div class="mb-3">
                        <label class="form-label">Название категории<span class="text-danger">*</span></label>
                        {{ form.name }}
                        {% if form.name.errors %}
                            <div class="text-danger small">{{ form.name.errors }}</div>
                        {% endif %}
                    </div>


                    <!-- Кнопки -->
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            <i class="fas fa-save me-2"></i>Сохранить категорию
                        </button>

                        <button type="button" onclick="history.back()" class="btn btn-secondary">Отмена</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
